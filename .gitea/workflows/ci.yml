name: TendExtensions registry CI

# One run per branch: a newer push cancels the superseded run for the same
# ref; the newest commit's run validates and releases everything below it.
concurrency:
  group: ci-${{ gitea.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and validate the registry
    runs-on: tend-ci
    env:
      CORE_COMMIT: 1aab99b06c5366b1e93bd1f0d9f7b51418f87657
      WORKSPACE: ${{ gitea.workspace }}
    steps:
      # Full history: the registry sequence is `git rev-list --count HEAD`,
      # which a shallow checkout would report as 1 on every run.
      - uses: https://j.santanafam.com/Rubirosa/gh-actions-checkout@v7
        with:
          fetch-depth: 0

      - uses: https://j.santanafam.com/Rubirosa/gh-actions-setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      # Private virtualenv per job: the runner's tool-cache site-packages is
      # shared by every job on tend-ci across three repositories, so another
      # job's pip install can replace a dependency under this one.
      - run: python -m venv "$RUNNER_TEMP/venv"
      - name: Install registry tooling dependencies
        run: $RUNNER_TEMP/venv/bin/python -m pip install -r tools/requirements.txt

      - name: Build every extension into dist/
        run: $RUNNER_TEMP/venv/bin/python tools/build.py

      - name: Refuse a registry built from a shallow history
        run: |
          test "$(git rev-parse --is-shallow-repository)" = "false"
          $RUNNER_TEMP/venv/bin/python - <<'PY'
          import json, subprocess
          seq = json.load(open("dist/registry.json"))["sequence"]
          count = int(subprocess.check_output(["git", "rev-list", "--count", "HEAD"]).decode())
          assert seq == count and seq > 1, (seq, count)
          print(f"registry sequence {seq} matches the commit count")
          PY

      - name: Check out the pinned panel core
        uses: https://j.santanafam.com/Rubirosa/gh-actions-checkout@v7
        with:
          repository: Rubirosa/tend.host
          ref: ${{ env.CORE_COMMIT }}
          path: public-core
          fetch-depth: 0
          token: ${{ secrets.CORE_REPOSITORY_TOKEN }}
          persist-credentials: false

      - name: Verify the pinned core checkout
        run: test "$(git -C public-core rev-parse HEAD)" = "$CORE_COMMIT"

      - name: Set up the pinned core's Go toolchain
        uses: https://j.santanafam.com/Rubirosa/gh-actions-setup-go@v5
        with:
          go-version-file: public-core/go.mod
          cache: false

      - name: Validate every built package against the real panel
        env:
          TEND_CORE_CHECKOUT: ${{ env.WORKSPACE }}/public-core
        run: $RUNNER_TEMP/venv/bin/python tools/validate_with_panel.py

      - name: Prove the signer round-trips (throwaway key, never the real one)
        run: |
          $RUNNER_TEMP/venv/bin/python - <<'PY'
          import base64
          import os
          import subprocess
          import sys

          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey

          key = Ed25519PrivateKey.generate()
          seed_b64 = base64.b64encode(key.private_bytes_raw()).decode()
          pub_b64 = base64.b64encode(key.public_key().public_bytes_raw()).decode()

          env = dict(os.environ, TEND_REGISTRY_SIGNING_KEY=seed_b64)
          subprocess.run([sys.executable, "tools/sign.py", "sign"], check=True, env=env)
          subprocess.run(
              [
                  sys.executable, "tools/sign.py", "--verify",
                  "dist/tend-extension-registry-v1.json",
                  "--public-key", pub_b64,
              ],
              check=True,
          )
          print("signer round-trip OK (throwaway key)")
          PY

      - uses: https://j.santanafam.com/Rubirosa/gh-actions-upload-artifact@v4
        with:
          name: registry-dist
          path: dist/

  publish_github:
    name: Publish verified main to GitHub
    runs-on: tend-ci
    needs: [build]
    if: (gitea.event_name == 'push' || gitea.event_name == 'workflow_dispatch') && gitea.ref == 'refs/heads/main'
    steps:
      - uses: https://j.santanafam.com/Rubirosa/gh-actions-checkout@v7
        with:
          ref: ${{ gitea.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: https://j.santanafam.com/Rubirosa/gh-actions-setup-python@v6
        with:
          python-version: "3.12"

      - name: Publish the exact verified commit
        env:
          GH_PUBLISH_TOKEN: ${{ secrets.GH_PUBLISH_TOKEN }}
          VERIFIED_SHA: ${{ gitea.sha }}
          GITEA_EVENT_NAME: ${{ gitea.event_name }}
          GITEA_REF: ${{ gitea.ref }}
        run: python scripts/publish-verified-main.py

  release:
    name: Sign and release the registry
    runs-on: tend-ci
    needs: [publish_github]
    if: (gitea.event_name == 'push' || gitea.event_name == 'workflow_dispatch') && gitea.ref == 'refs/heads/main'
    steps:
      - uses: https://j.santanafam.com/Rubirosa/gh-actions-checkout@v7

      - uses: https://j.santanafam.com/Rubirosa/gh-actions-download-artifact@v4
        with:
          name: registry-dist
          path: dist

      - uses: https://j.santanafam.com/Rubirosa/gh-actions-setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      # Private virtualenv per job: the runner's tool-cache site-packages is
      # shared by every job on tend-ci across three repositories, so another
      # job's pip install can replace a dependency under this one.
      - run: python -m venv "$RUNNER_TEMP/venv"
      - name: Install registry tooling dependencies
        run: $RUNNER_TEMP/venv/bin/python -m pip install -r tools/requirements.txt

      - name: Sign the registry with the production key
        env:
          TEND_REGISTRY_SIGNING_KEY: ${{ secrets.TEND_REGISTRY_SIGNING_KEY }}
        run: $RUNNER_TEMP/venv/bin/python tools/sign.py sign

      - name: Create or update the GitHub release
        env:
          GH_PUBLISH_TOKEN: ${{ secrets.GH_PUBLISH_TOKEN }}
        run: $RUNNER_TEMP/venv/bin/python tools/release.py
