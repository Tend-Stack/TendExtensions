name: Publish the Tend MCP runtime

# Build, sign and publish one version of the optional `host.tend.mcp` component
# runtime: the confined worker image for both platforms, the browser package, the
# two signed envelopes a panel verifies, and `runtime-inputs.json` (the inputs
# digest this runtime was built from). Afterwards it records the release in the
# registry listing `components/host.tend.mcp.json` on main, which builds registry
# v1.2. See docs/mcp-runtime.md.
#
# Dispatch-triggered, and now dispatchable by a machine: the core's release
# workflow calls
#
#   POST /api/v1/repos/Rubirosa/TendExtensions/actions/workflows/mcp-runtime.yml/dispatches
#   {"ref": "main", "inputs": {"core_commit": "<40-hex>"}}
#
# whenever the runtime inputs digest of a core push differs from the one recorded
# beside the published release (cmd/tend-mcp-inputs; the dispatcher decides). The
# window is derived, never typed: min from the core's compatibility file (or the
# core VERSION when the capability list grew), max the open ceiling
# `<major>.999999.999999`, because the worker's compatibility is decided by its
# inputs, not by the core version.
#
# What it does not remove is the decision. A component runtime is the one thing
# this registry publishes that a panel *executes*, so the run still refuses more
# than it does: it publishes only from main, only under the pinned key, only
# envelopes that describe the artifacts beside them, and only a release whose
# sequence climbs above the one the alias already serves.
#
# The core commit is an input rather than a pin in this file because the runtime
# is built from the panel core's own source (cmd/tend-mcp-worker,
# cmd/tend-mcp-pack, extensions/mcp-ui). Naming the exact commit is what makes
# the build auditable: the same commit and the same version produce the same
# three artifact digests anywhere, which is the only reason the digests inside a
# signed envelope are worth checking.

on:
  workflow_dispatch:
    inputs:
      core_commit:
        description: "Full 40-hex commit on Rubirosa/tend.host to build the runtime from"
        required: true
      runtime_version:
        description: "Runtime version x.y.z. Empty: bump the patch of the version the alias serves"
        required: false
        default: ""
      max_core_version:
        description: "Emergency override of max_core_version. Empty: the core VERSION at core_commit. Recorded in the release notes"
        required: false
        default: ""
      force:
        description: "Publish even though core_commit is not a newer core release than the alias already covers"
        type: boolean
        default: false
      dry_run:
        description: "Build, sign, verify and print the plan — publish nothing"
        type: boolean
        default: false
      overwrite:
        description: "Replace assets already published under this version (only for a release nothing has installed)"
        type: boolean
        default: false

# One publish at a time. A core push dispatches whenever its runtime inputs digest
# differs from the published one, so two pushes inside one build can dispatch twice;
# queued, the second run sees the recorded digest already equal and refuses instead
# of racing the first to the next sequence.
concurrency:
  group: mcp-runtime
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Build, sign and publish the runtime
    runs-on: tend-ci
    env:
      CORE_COMMIT: ${{ gitea.event.inputs.core_commit }}
      REQUESTED_VERSION: ${{ gitea.event.inputs.runtime_version }}
      MAX_CORE_OVERRIDE: ${{ gitea.event.inputs.max_core_version }}
      FORCE: ${{ gitea.event.inputs.force }}
      DRY_RUN: ${{ gitea.event.inputs.dry_run }}
      OVERWRITE: ${{ gitea.event.inputs.overwrite }}
      WORKSPACE: ${{ gitea.workspace }}
      RELEASE_DIR: ${{ gitea.workspace }}/dist/mcp-runtime
      # Through the environment rather than inline `${{ }}` in a shell: an
      # expression expanded into a script is text the shell parses, and a ref or
      # a sha is not this workflow's to quote for.
      GITEA_REF: ${{ gitea.ref }}
      GITEA_SHA: ${{ gitea.sha }}
      # The key id a panel pins in internal/mcp/distribution. Every step that
      # touches a key checks against this, so a rotated key fails the run rather
      # than publishing a release no panel will trust.
      EXPECTED_KEY_ID: 17949d0c35c1eb4d
    steps:
      - name: Validate the inputs
        run: |
          echo "$CORE_COMMIT" | grep -Eq '^[0-9a-f]{40}$' \
            || { echo "core_commit must be a full lowercase 40-hex commit sha" >&2; exit 1; }
          VERSION_RE='^(0|[1-9][0-9]{0,5})\.(0|[1-9][0-9]{0,5})\.(0|[1-9][0-9]{0,5})$'
          if [ -n "$REQUESTED_VERSION" ]; then
            echo "$REQUESTED_VERSION" | grep -Eq "$VERSION_RE" \
              || { echo "runtime_version must be x.y.z, got '$REQUESTED_VERSION'" >&2; exit 1; }
          fi
          if [ -n "$MAX_CORE_OVERRIDE" ]; then
            echo "$MAX_CORE_OVERRIDE" | grep -Eq "$VERSION_RE" \
              || { echo "max_core_version must be x.y.z, got '$MAX_CORE_OVERRIDE'" >&2; exit 1; }
          fi

      # The listing commit-back below pushes to main with this token (a push made with
      # the job's own token would not start ci.yml, the same reason import-approved.yml
      # has it). Checked before anything is built or published so a missing secret
      # fails the run here, not after a release exists with no listing to match it.
      - name: Require the commit-back token
        if: ${{ gitea.event.inputs.dry_run != 'true' }}
        env:
          IMPORT_PUSH_TOKEN: ${{ secrets.IMPORT_PUSH_TOKEN }}
        run: |
          test -n "${IMPORT_PUSH_TOKEN:-}" \
            || { echo "IMPORT_PUSH_TOKEN is not set on this repository: the published release could not be recorded in components/host.tend.mcp.json" >&2; exit 1; }

      # The release is tagged on the registry commit this run checks out, and the
      # tag has to exist on GitHub. Only main is mirrored there
      # (scripts/publish-verified-main.py), so a dispatch from any other ref would
      # create a tag pointing at a commit GitHub has never seen.
      - name: Refuse to publish from anything but main
        run: |
          test "$GITEA_REF" = "refs/heads/main" \
            || { echo "this workflow publishes only from main, got '$GITEA_REF'" >&2; exit 1; }

      - uses: https://j.santanafam.com/Rubirosa/gh-actions-checkout@v7
        with:
          ref: ${{ gitea.sha }}
          persist-credentials: false

      # Read-only on the core repository: this run builds from it and never
      # writes to it.
      - name: Check out the panel core at the named commit
        uses: https://j.santanafam.com/Rubirosa/gh-actions-checkout@v7
        with:
          repository: Rubirosa/tend.host
          ref: ${{ gitea.event.inputs.core_commit }}
          path: core
          fetch-depth: 0
          token: ${{ secrets.CORE_REPOSITORY_TOKEN }}
          persist-credentials: false

      - name: Verify the core checkout is the commit that was named
        run: test "$(git -C core rev-parse HEAD)" = "$CORE_COMMIT"

      - uses: https://j.santanafam.com/Rubirosa/gh-actions-setup-python@v6
        with:
          python-version: "3.12"

      # Private virtualenv per job: the runner's tool-cache site-packages is
      # shared by every job on tend-ci across three repositories, so another
      # job's pip install can replace a module under this one. The publisher
      # itself needs nothing but the standard library.
      - run: python -m venv "$RUNNER_TEMP/venv"

      - uses: https://j.santanafam.com/Rubirosa/gh-actions-setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      # What decides whether this publish changes anything: the digest of every file the
      # runtime is built from, and its capability list. The core at core_commit must carry
      # cmd/tend-mcp-inputs; an older commit fails here, before anything is built.
      - name: Fingerprint the runtime inputs
        run: |
          set -euo pipefail
          test -d core/cmd/tend-mcp-inputs \
            || { echo "core_commit has no cmd/tend-mcp-inputs: dispatch a commit that carries the inputs digest" >&2; exit 1; }
          ( cd core && go run ./cmd/tend-mcp-inputs --root . ) > "$RUNNER_TEMP/mcp-inputs.json"
          cat "$RUNNER_TEMP/mcp-inputs.json"

      # Everything that used to be typed into the dispatch form, derived instead:
      # the compatibility window from the core checkout's VERSION and
      # RELEASE_COMPATIBILITY.json, the runtime version from the version the alias
      # serves, the sequence from that version. It refuses here — before the build
      # and long before the key is decoded — if the window is empty, if the
      # sequence would not climb, or if the runtime inputs are the ones the alias
      # was already built from. It also writes runtime-inputs.json, the sixth asset.
      - name: Resolve the window, the version and the sequence
        run: |
          set -euo pipefail
          test -n "${GITHUB_ENV:-}" || { echo "GITHUB_ENV is not set on this runner" >&2; exit 1; }
          ARGS=(--core core --json-out "$RUNNER_TEMP/mcp-plan.json" --env-out "$GITHUB_ENV")
          if [ -n "$REQUESTED_VERSION" ]; then ARGS+=(--runtime-version "$REQUESTED_VERSION"); fi
          if [ -n "$MAX_CORE_OVERRIDE" ]; then ARGS+=(--max-core-version "$MAX_CORE_OVERRIDE"); fi
          if [ "$FORCE" = "true" ]; then ARGS+=(--force); fi
          ARGS+=(--inputs "$RUNNER_TEMP/mcp-inputs.json" --core-commit "$CORE_COMMIT"
                 --inputs-out "$RELEASE_DIR/runtime-inputs.json")
          $RUNNER_TEMP/venv/bin/python -m tools.mcp_window "${ARGS[@]}"

      - name: Report what this run will publish
        run: |
          echo "runtime version: $RUNTIME_VERSION (sequence $RUNTIME_SEQUENCE)"
          echo "core window: $MIN_CORE_VERSION to $MAX_CORE_VERSION"

      # No key in this step. Build and pack are reproducible and carry no
      # authority, so the signing secret is exposed to exactly one step below.
      - name: Build and pack both platforms
        run: |
          core/scripts/mcp-runtime-release.sh --version "$RUNTIME_VERSION" --out "$RELEASE_DIR"

      - name: Check the committed public key is the pinned one
        run: |
          KEY_ID="$(python3 - <<'PY'
          import base64, hashlib, pathlib
          raw = base64.b64decode(pathlib.Path("keys/tend-mcp-runtime.pub").read_text().strip(), validate=True)
          assert len(raw) == 32, f"public key must decode to 32 bytes, got {len(raw)}"
          print(hashlib.sha256(raw).hexdigest()[:16])
          PY
          )"
          echo "committed public key id: $KEY_ID"
          test "$KEY_ID" = "$EXPECTED_KEY_ID" \
            || { echo "keys/tend-mcp-runtime.pub is not the pinned key $EXPECTED_KEY_ID" >&2; exit 1; }

      # The only step the signing secret reaches. The key is written with mode
      # 0600 to the runner's own temporary directory, used once, and removed on
      # every exit path including a failure — a trap rather than a later step,
      # because a step that never runs cannot clean up after one that failed.
      #
      # The window comes from the resolve step; nothing about it is typed here.
      # `--sequence` is deliberately absent: the core derives the sequence from
      # the version and refuses any other value, so the version is the only thing
      # that can make a release climb.
      - name: Sign and verify both envelopes
        env:
          TEND_MCP_SIGNING_KEY_B64: ${{ secrets.TEND_MCP_SIGNING_KEY_B64 }}
        run: |
          set -euo pipefail
          KEY_FILE="$RUNNER_TEMP/tend-mcp.key"
          trap 'rm -f "$KEY_FILE"' EXIT
          test -n "${TEND_MCP_SIGNING_KEY_B64:-}" \
            || { echo "TEND_MCP_SIGNING_KEY_B64 is not set on this repository" >&2; exit 1; }
          ( umask 077 && printf '%s' "$TEND_MCP_SIGNING_KEY_B64" | base64 -d > "$KEY_FILE" )
          chmod 600 "$KEY_FILE"
          test -s "$KEY_FILE" || { echo "the decoded signing key is empty" >&2; exit 1; }

          PUBLIC_KEY="$WORKSPACE/keys/tend-mcp-runtime.pub"
          for ARCH in amd64 arm64; do
            ( cd core && go run ./cmd/tend-mcp-release sign "$KEY_FILE" \
                --version "$RUNTIME_VERSION" \
                --platform "linux/$ARCH" \
                --ui "$RELEASE_DIR/tend-mcp-ui.zip" \
                --service "$RELEASE_DIR/service-linux-$ARCH.zip" \
                --min-core "$MIN_CORE_VERSION" \
                --max-core "$MAX_CORE_VERSION" \
                --days 365 \
                --out "$RELEASE_DIR/runtime-linux-$ARCH.json" )
          done
          rm -f "$KEY_FILE"

          # Exactly the verification a panel runs, against the public key this
          # repository commits, at BOTH ends of the derived window: a release that
          # would be refused on installation by the oldest or the newest core it
          # claims is refused here instead, before anything is published.
          for ARCH in amd64 arm64; do
            for CORE_VERSION in "$MIN_CORE_VERSION" "$MAX_CORE_VERSION"; do
              ( cd core && go run ./cmd/tend-mcp-release verify "$PUBLIC_KEY" \
                  "$RELEASE_DIR/runtime-linux-$ARCH.json" \
                  --core-version "$CORE_VERSION" --platform "linux/$ARCH" ) \
                | tee "$RUNNER_TEMP/verify-$ARCH-$CORE_VERSION.txt"
              grep -q "key $EXPECTED_KEY_ID" "$RUNNER_TEMP/verify-$ARCH-$CORE_VERSION.txt" \
                || { echo "runtime-linux-$ARCH.json was not signed by $EXPECTED_KEY_ID" >&2; exit 1; }
            done
          done

      - name: Confirm the signing key is gone
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/tend-mcp.key"
          test ! -e "$RUNNER_TEMP/tend-mcp.key"

      - name: Report the six assets and their digests
        run: |
          cd "$RELEASE_DIR"
          sha256sum runtime-linux-amd64.json runtime-linux-arm64.json runtime-inputs.json \
                    tend-mcp-ui.zip service-linux-amd64.zip service-linux-arm64.zip

      # The same decisions the publish makes, written to a directory and sent
      # nowhere. It runs on every dispatch, so the plan is in the log even when
      # the publish then fails, and `dry_run` stops the job right after it.
      - name: Write the publish plan without touching the network
        run: |
          set -euo pipefail
          $RUNNER_TEMP/venv/bin/python -m tools.mcp_release \
            --version "$RUNTIME_VERSION" --revision "$GITEA_SHA" --dist "$RELEASE_DIR" \
            --plan "$RUNNER_TEMP/mcp-plan.json" --dry-run-out "$RUNNER_TEMP/dry-run"
          cat "$RUNNER_TEMP/dry-run/plan.json"

      # One step for both releases: the immutable `mcp-runtime-<version>` and then
      # the moving alias `mcp-runtime-latest`, in that order, so the alias never
      # points panels at a runtime whose own release does not exist.
      - name: Create or update the release and move the alias
        if: ${{ gitea.event.inputs.dry_run != 'true' }}
        env:
          GH_PUBLISH_TOKEN: ${{ secrets.GH_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          ARGS=(--version "$RUNTIME_VERSION" --revision "$GITEA_SHA" --dist "$RELEASE_DIR"
                --plan "$RUNNER_TEMP/mcp-plan.json")
          if [ "$OVERWRITE" = "true" ]; then
            ARGS+=(--overwrite)
          fi
          $RUNNER_TEMP/venv/bin/python -m tools.mcp_release "${ARGS[@]}"

      # The registry listing follows the release, never the other way round: the
      # version release and the alias exist (and carry the bytes the listing pins)
      # before main names them. The push starts ci.yml, which builds and signs
      # registry v1.2 with the new listing. Only components/host.tend.mcp.json is
      # staged; a concurrent push to main is rebased over, not overwritten.
      - name: Check out main to record the release in the registry listing
        if: ${{ gitea.event.inputs.dry_run != 'true' }}
        uses: https://j.santanafam.com/Rubirosa/gh-actions-checkout@v7
        with:
          ref: main
          path: registry-main
          fetch-depth: 0
          token: ${{ secrets.IMPORT_PUSH_TOKEN }}

      - name: Record the published release in components/host.tend.mcp.json and push it
        if: ${{ gitea.event.inputs.dry_run != 'true' }}
        run: |
          set -euo pipefail
          LISTING=components/host.tend.mcp.json
          $RUNNER_TEMP/venv/bin/python -m tools.mcp_release \
            --version "$RUNTIME_VERSION" --dist "$RELEASE_DIR" \
            --update-component "$WORKSPACE/registry-main/$LISTING"
          cd registry-main
          if git diff --quiet -- "$LISTING"; then
            echo "$LISTING already lists $RUNTIME_VERSION"
            exit 0
          fi
          git config user.name "Tend registry"
          git config user.email "registry@tend.host"
          git add -- "$LISTING"
          git commit -m "chore(registry): list Tend MCP $RUNTIME_VERSION" \
                     -m "Published by the mcp-runtime workflow from core $CORE_COMMIT."
          for ATTEMPT in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push attempt $ATTEMPT failed; rebasing over main" >&2
            git pull --rebase origin main
          done
          echo "could not push the listing for $RUNTIME_VERSION; the release is published, re-run the listing step by hand" >&2
          exit 1

      - uses: https://j.santanafam.com/Rubirosa/gh-actions-upload-artifact@v4
        with:
          name: mcp-runtime-${{ env.RUNTIME_VERSION }}
          path: dist/mcp-runtime/
