<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 155" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="260" y2="155" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b1016"/>
      <stop offset="1" stop-color="#0f1a24"/>
    </linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="259" height="154" rx="20" fill="url(#bg)" stroke="#ffffff26"/>

  <!-- today: weekday + day number -->
  <g fill="#e6eef7">
    <text x="24" y="52" font-size="10" font-weight="700" letter-spacing="1" fill="#9fb0c3">TUE</text>
    <text x="24" y="86" font-size="34" font-weight="700">22</text>
  </g>

  <!-- divider -->
  <rect x="76" y="30" width="1" height="96" fill="#ffffff1f"/>

  <!-- upcoming rows -->
  <g>
    <circle cx="96" cy="42" r="4" fill="#38bdf8"/>
    <text x="106" y="46" font-size="10" fill="#9fb0c3">2:00 PM</text>
    <text x="160" y="46" font-size="11.5" font-weight="600" fill="#e6eef7">Team sync</text>

    <circle cx="96" cy="70" r="4" fill="#fbbf24"/>
    <text x="106" y="74" font-size="10" fill="#9fb0c3">All day</text>
    <text x="160" y="74" font-size="11.5" font-weight="600" fill="#e6eef7">Product launch</text>

    <circle cx="96" cy="98" r="4" fill="#fb7185"/>
    <text x="106" y="102" font-size="10" fill="#9fb0c3">Tomorrow · 9:00 AM</text>
    <text x="106" y="118" font-size="11.5" font-weight="600" fill="#e6eef7">Dentist appointment</text>
  </g>
</svg>
